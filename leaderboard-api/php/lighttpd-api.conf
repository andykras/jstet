# TetColor vhost additions for the same-origin leaderboard API.
# Applied inside the existing `$HTTP["host"] == "tetcolor.andykras.org"` block
# in /etc/lighttpd/conf.d/97-tetcolor.conf. Replace the existing rewrite reset
# with the rewrite below; do not assign url.rewrite twice.

# One long-lived PHP entry point outside immutable releases.
url.rewrite = ( "^/api/v1/" => "/api/index.php" )
alias.url += ( "/api/" => "/srv/tetcolor/api/" )

$HTTP["url"] =~ "^/api/" {
    fastcgi.server = ( ".php" => ((
        "bin-path" => "/usr/bin/php-cgi",
        "socket" => "/tmp/php.socket",
        "max-procs" => 2,
        "check-local" => "enable"
    )) )
    fastcgi.map-extensions = ()
}
